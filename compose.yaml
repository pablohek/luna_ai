# Local development PostgreSQL only.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: local-luna-password
      POSTGRES_DB: luna
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - luna_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luna -d luna"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  luna_postgres:
